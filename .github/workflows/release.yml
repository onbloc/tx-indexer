name: release

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 태그 prefix
        required: true
        type: choice
        options:
          - staging-gnoscan
          - testnet-gnoscan
          - mainnet-gnoscan
          - testnet-gnoswap
          - mainnet-gnoswap
      version:
        description: 버전 (X.Y.Z)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.prefix }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: 태그 생성 및 릴리스 노트
    # main, chain/* 에서만 릴리스 가능
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/chain/')
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      targets: ${{ steps.targets.outputs.targets }}
      slack_ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: 릴리스 App 토큰 발급
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: 태그 검증
        id: tag
        env:
          PREFIX: ${{ inputs.prefix }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::버전 형식은 X.Y.Z"; exit 1
          fi
          tag="${PREFIX}-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} 태그가 이미 존재함"; exit 1
          fi
          # 같은 prefix의 직전 태그
          prev=$(git tag --list "${PREFIX}-v*" --sort=-v:refname \
            | grep -E "^${PREFIX}-v[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)
          if [ -n "$prev" ]; then
            prev_ver="${prev#"${PREFIX}"-v}"
            top=$(printf '%s\n%s\n' "$prev_ver" "$VERSION" | sort -V | tail -n1)
            if [ "$top" != "$VERSION" ] || [ "$prev_ver" = "$VERSION" ]; then
              echo "::error::${VERSION} 은 ${prev} 보다 높아야 함"; exit 1
            fi
          fi
          # mainnet-gnoscan 은 같은 버전의 staging/testnet 태그가 먼저 있어야 함
          if [ "$PREFIX" = "mainnet-gnoscan" ]; then
            for pre in staging-gnoscan testnet-gnoscan; do
              if ! git rev-parse -q --verify "refs/tags/${pre}-v${VERSION}" >/dev/null; then
                echo "::error::${pre}-v${VERSION} 태그가 먼저 필요함"; exit 1
              fi
            done
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"

      - name: 배포 대상 결정
        id: targets
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          gnoscan="onbloc/onbloc-helm-charts"
          gnoswap="gnoswap-labs/gnoswap-helm-charts"
          case "$PREFIX" in
            staging-gnoscan) env=prd-stage-gnoscan-v2;   repo=$gnoscan; helm=prd;         network=staging ;;
            testnet-gnoscan) env=prd-testnet-gnoscan-v2; repo=$gnoscan; helm=prd;         network=testnet ;;
            mainnet-gnoscan) env=prd-gnoscan-v2;         repo=$gnoscan; helm=prd;         network=mainnet ;;
            # testnet-gnoswap: 신규, env 는 mainnet 값 재사용 (확인 필요)
            testnet-gnoswap) env=prd-gnoswap-v2;         repo=$gnoswap; helm=prd-testnet; network= ;;
            mainnet-gnoswap) env=prd-gnoswap-v2;         repo=$gnoswap; helm=prd-green;   network= ;;
            *) echo "::error::알 수 없는 prefix: ${PREFIX}"; exit 1 ;;
          esac
          targets=$(jq -cn --arg env "$env" --arg repo "$repo" --arg helm "$helm" --arg network "$network" '
            [{ app_name: "tx-indexer", env: $env, helm_chart_repo: $repo, helm_branch: $helm, network: $network }]')
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

      - name: 태그 push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.tag.outputs.prev }}
        run: |
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [ -n "$PREV" ]; then args+=(--notes-start-tag "$PREV"); fi
          gh release create "$TAG" "${args[@]}"

      - name: Slack 공유
        id: slack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.tag.outputs.prev }}
          SLACK_TOKEN: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "Slack 설정 없음, 건너뜀"; exit 0
          fi
          url=$(gh release view "$TAG" --json url -q .url)
          # GitHub markdown -> Slack mrkdwn
          body=$(gh release view "$TAG" --json body -q .body \
            | sed -E 's/^#+ (.*)$/*\1*/; s/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' | head -c 2800)
          header="*${GITHUB_REPOSITORY}* \`${TAG}\` (기준: \`${PREV:-최초}\`) by ${GITHUB_ACTOR}"
          res=$(jq -n --arg ch "$SLACK_CHANNEL" --arg h "$header" --arg b "${body:-변경 사항 없음}" --arg u "$url" '{
              channel: $ch, text: $h,
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: $h}},
                {type: "section", text: {type: "mrkdwn", text: $b}},
                {type: "context", elements: [{type: "mrkdwn", text: ("<" + $u + "|릴리스 노트 전체 보기>")}]}
              ]}' \
            | curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                -H 'Content-Type: application/json; charset=utf-8' -d @-)
          if [ "$(echo "$res" | jq -r .ok)" != "true" ]; then
            echo "::warning::Slack 전송 실패: $(echo "$res" | jq -r .error)"; exit 0
          fi
          echo "ts=$(echo "$res" | jq -r .ts)" >> "$GITHUB_OUTPUT"

  deploy:
    name: 배포 (${{ matrix.app_name }})
    needs: prepare
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/app_template.yml
    with:
      app-name: ${{ matrix.app_name }}
      env: ${{ matrix.env }}
      helm-chart-repo: ${{ matrix.helm_chart_repo }}
      helm-branch: ${{ matrix.helm_branch }}
      network: ${{ matrix.network }}
    secrets:
      AWS_IAM_OIDC: ${{ secrets.AWS_IAM_OIDC }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      REGION: ${{ secrets.PRD_REGION_V2 }}

  notify:
    name: 배포 결과 알림
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.slack_ts != ''
    runs-on: ubuntu-latest
    steps:
      - name: Slack 스레드에 결과 등록
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          THREAD_TS: ${{ needs.prepare.outputs.slack_ts }}
          RESULT: ${{ needs.deploy.result }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then status="배포 성공"; else status="배포 실패 (${RESULT})"; fi
          jq -n --arg ch "$SLACK_CHANNEL" --arg ts "$THREAD_TS" --arg t "\`${TAG}\` ${status} <${RUN_URL}|실행 로그>" \
            '{channel: $ch, thread_ts: $ts, text: $t}' \
          | curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H 'Content-Type: application/json; charset=utf-8' -d @- >/dev/null
